{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-xl">
    <h2 class="text-2xl font-bold mb-6 text-indigo-400">Create Account</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm mb-1">Username</label>
            <input type="text" name="username" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
        </div>
        <div>
            <label class="block text-sm mb-1">Email</label>
            <input type="email" name="email" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
        </div>
        <div>
            <label class="block text-sm mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2 rounded-lg mt-2">Sign Up</button>
    </form>
</div>
{% endblock %}
