{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-gray-800 p-6 md:p-8 rounded-xl border border-gray-700 shadow-xl text-center">
    <div class="mb-4">
        <span class="text-xs uppercase font-bold tracking-widest text-indigo-400">Match Correction</span>
        <h2 class="text-xl md:text-2xl font-bold text-white mt-1">Edit Game Record</h2>
    </div>
    
    <form method="POST" id="gameForm">
        <input type="hidden" name="winner_id" id="winnerInput" value="{{ game.winner_id }}">

        <div class="flex flex-col md:flex-row gap-4 md:gap-6 justify-center mb-6 md:mb-8 mt-6">
            <!-- Player 1 Card -->
            <div id="card-{{ game.player1.id }}" onclick="selectWinner('{{ game.player1.id }}')" 
                 class="flex-1 cursor-pointer border-2 rounded-xl p-4 md:p-8 transition-all {% if game.winner_id == game.player1.id %}bg-gray-800 border-green-500 scale-105 shadow-[0_0_15px_rgba(34,197,94,0.4)]{% else %}bg-gray-900 border-gray-700 hover:border-indigo-400{% endif %}">
                <div class="text-3xl md:text-4xl mb-2 md:mb-3">🍺</div>
                <h3 class="text-lg md:text-xl font-bold text-white truncate">{{ game.player1.username }}</h3>
            </div>
            
            <div class="flex items-center justify-center font-bold text-gray-500 text-lg md:text-xl py-2 md:py-0">VS</div>

            <!-- Player 2 Card -->
            <div id="card-{{ game.player2.id }}" onclick="selectWinner('{{ game.player2.id }}')" 
                 class="flex-1 cursor-pointer border-2 rounded-xl p-4 md:p-8 transition-all {% if game.winner_id == game.player2.id %}bg-gray-800 border-green-500 scale-105 shadow-[0_0_15px_rgba(34,197,94,0.4)]{% else %}bg-gray-900 border-gray-700 hover:border-indigo-400{% endif %}">
                <div class="text-3xl md:text-4xl mb-2 md:mb-3">🍺</div>
                <h3 class="text-lg md:text-xl font-bold text-white truncate">{{ game.player2.username }}</h3>
            </div>
        </div>

        <div id="cupsSection" class="mb-6 md:mb-8 max-w-xs mx-auto">
            <label class="block text-sm font-medium mb-2 text-indigo-300">Correct Cup Differential</label>
            <input type="number" min="1" max="10" name="cups_won_by" id="cupsInput" required
                   value="{% if game.score1 == 10 %}{{ 10 - game.score2 }}{% else %}{{ 10 - game.score1 }}{% endif %}"
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-center text-xl text-white font-bold">
        </div>

        <!-- NEW: Date & Time Editor -->
        <div class="mb-8 max-w-xs mx-auto">
            <label class="block text-sm font-medium mb-2 text-indigo-300">Date & Time Played</label>
            <input type="datetime-local" name="created_at" value="{{ formatted_date }}" required
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-indigo-500 focus:outline-none">
        </div>


        <div class="flex gap-4">
            <a href="/catalog" class="w-1/3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg text-lg transition-colors flex items-center justify-center">
                Cancel
            </a>
            <button type="submit" id="submitBtn" class="w-2/3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg text-lg transition-colors shadow-lg">
                Update Record
            </button>
        </div>
    </form>
</div>

<script>
    function selectWinner(winnerId) {
        document.getElementById('winnerInput').value = winnerId;
        
        const p1Id = "{{ game.player1.id }}";
        const p2Id = "{{ game.player2.id }}";
        
        document.getElementById('card-' + p1Id).className = "flex-1 cursor-pointer bg-gray-900 border-2 border-gray-700 rounded-xl p-4 md:p-8 transition-all";
        document.getElementById('card-' + p2Id).className = "flex-1 cursor-pointer bg-gray-900 border-2 border-gray-700 rounded-xl p-4 md:p-8 transition-all";

        document.getElementById('card-' + winnerId).className = "flex-1 cursor-pointer bg-gray-800 border-4 border-green-500 rounded-xl p-4 md:p-8 transition-all scale-105 shadow-[0_0_15px_rgba(34,197,94,0.4)]";
        
        document.getElementById('cupsInput').focus();
    }
</script>
{% endblock %}
